<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HF Model Provenance Scanner — Dashboards</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.container{max-width:600px;text-align:center}
h1{font-size:1.5rem;margin-bottom:8px}
p{color:var(--muted);margin-bottom:32px;font-size:0.9rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;text-decoration:none;color:var(--text);transition:border-color 0.2s,transform 0.2s}
a:hover{border-color:var(--blue);transform:translateY(-3px)}
a h2{font-size:1rem;color:var(--blue);margin-bottom:8px}
a p{color:var(--muted);font-size:0.8rem;margin:0}
</style>
</head>
<body>
<div class="container">
<h1>HF Model Provenance Scanner</h1>
<p>Supply chain attack detection for HuggingFace models. Choose a dashboard view:</p>
<div class="cards">
<a href="security/">
<h2>Security Operations</h2>
<p>Attack coverage, rule triggers, severity distribution, scan results</p>
</a>
<a href="realtime/">
<h2>Realtime SOC</h2>
<p>Live threat visualization, 3D topology, kill chain analysis</p>
</a>
</div>
</div>
</body>
</html>
