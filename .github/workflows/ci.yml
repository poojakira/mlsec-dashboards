name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ -v

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check required static assets
        run: |
          python - <<'PY'
          from pathlib import Path

          required = ["index.html", "README.md", "SECURITY.md"]
          missing = [path for path in required if not Path(path).exists()]
          if missing:
              raise SystemExit(f"missing required files: {missing}")
          html = Path("index.html").read_text(encoding="utf-8")
          banned = ["SLSA Level 3", "Cosign keyless", "unrejectable", "100% on schedule"]
          found = [term for term in banned if term.lower() in html.lower()]
          if found:
              raise SystemExit(f"unsupported portfolio claim(s): {found}")
          print("static portfolio checks passed")
          PY

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
      - name: Audit dependencies (blocking)
        run: pip-audit --skip-editable --progress-spinner=off
